name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './web/svelte-app/package-lock.json'

      - name: Test scraper script
        run: node --test tests/test_scrape_puzzle.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: ./build-web.sh

      - name: Install dependencies
        run: |
          cd web/svelte-app
          npm ci

      - name: Build Svelte app
        run: |
          cd web/svelte-app
          npm run build

      - name: Install Playwright browsers
        run: |
          cd web/svelte-app
          npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          cd web/svelte-app
          npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/svelte-app/playwright-report/
          retention-days: 30

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-out

      # Copies dist over the branch without deleting anything else, so the
      # puzzles/ JSON that scrape-puzzle.yml commits here survives a deploy.
      # Pages serves this branch directly (Settings -> Pages must stay on
      # "Deploy from a branch"), so a scraped puzzle goes live without a rebuild.
      - name: Deploy to gh-pages
        working-directory: gh-pages-out
        run: |
          cp -R ../web/svelte-app/dist/. .
          touch .nojekyll  # Pages runs Jekyll on branch deploys otherwise
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No change to publish." && exit 0
          git commit -m "deploy: $GITHUB_SHA"
          # scrape-puzzle.yml pushes here too, so retry on a non-fast-forward.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt); rebasing onto gh-pages."
            git pull --rebase origin gh-pages
          done
          exit 1
